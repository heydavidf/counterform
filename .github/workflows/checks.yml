# Runs on every push to main, on pull requests and weekly. Install scripts are disabled, so no dependency
# code runs at install time. The Node matrix reports as "checks (22)" and "checks (24)"; read the exact
# names from the first pull request before requiring them in a branch ruleset.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a pull request's commits through the API
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install (lockfile must match, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests in Chromium (Playwright starts the app)
        run: npx playwright test --project=chromium

      - name: Known vulnerabilities in shipped dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Shell blocks in the docs paste cleanly (bash and zsh)
        run: bash .github/check-shell-blocks.sh

      - name: Tripwire (personal paths, junk files, silenced checks)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF" 2>/dev/null; then bash .github/tripwire.sh "$BASE_REF"; else echo "::warning::No base commit available, so newly silenced checks were not looked for"; bash .github/tripwire.sh; fi

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so report findings in the job log instead of as pull request comments.
          GITLEAKS_ENABLE_COMMENTS: "false"
